# ===== FONTS =====
font_family      Literation Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 12.0

# Font features
disable_ligatures never

# ===== CURSOR =====
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# ===== SCROLLBACK =====
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0

# ===== MOUSE =====
mouse_hide_wait 3.0
url_color #0087bd
url_style curly
open_url_with default
copy_on_select yes
strip_trailing_spaces smart

# ===== PERFORMANCE =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== BELL =====
enable_audio_bell no
visual_bell_duration 0.0

# ===== WINDOW LAYOUT =====
remember_window_size  yes
initial_window_width  1200
initial_window_height 800
window_padding_width 4
window_padding_height 4
window_border_width 1pt
draw_minimal_borders yes
hide_window_decorations no
placement_strategy center

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# ===== COLOR SCHEME (Night Owlish Light) =====
# Matching your Alacritty theme

# Background and foreground
foreground #000000
background #FFFFFF
background_opacity 0.95

# Cursor
cursor #403f53
cursor_text_color #fbfbfb

# Selection
selection_foreground #403f53
selection_background #f2f2f2

# Normal colors
color0 #011627
color1 #d3423e
color2 #2aa298
color3 #daaa01
color4 #336FD8
color5 #403f53
color6 #2383d1
color7 #7a8181

# Bright colors
color8  #7a8181
color9  #f76e6e
color10 #49d0c5
color11 #dac26b
color12 #336FD8
color13 #697098
color14 #2383d1
color15 #989fb1

# ===== ADVANCED =====
shell .
editor .
allow_remote_control yes
listen_on unix:/tmp/kitty

# Close window without confirmation
confirm_os_window_close 0

# ===== KEYBOARD SHORTCUTS =====

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Window management
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward

# Navigate between splits with Alt+Arrow keys
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Tab management
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward

# Layout management
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack

# Font sizes
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Scrolling
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Miscellaneous
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f5 load_config_file
map ctrl+shift+escape kitty_shell window

# ===== SPLITS/LAYOUTS =====
enabled_layouts splits,stack,tall,fat,grid

# Split shortcuts - YOUR CUSTOM KEYBINDINGS
map alt+2 launch --location=hsplit --cwd=current
map alt+3 launch --location=vsplit --cwd=current

# Resize splits
map ctrl+shift+r start_resizing_window
map alt+shift+left resize_window narrower
map alt+shift+right resize_window wider
map alt+shift+up resize_window taller
map alt+shift+down resize_window shorter
