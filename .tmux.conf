# ─── Prefix (ALT-Space as leader) ────────────────────────────────────────────
unbind C-b
set -g prefix M-Space
bind-key M-Space send-prefix

# ─── leader-w key table ───────────────────────────────────────────────────────
bind-key w switch-client -T w_table

# leader-w-1 : new window
bind-key -T w_table 1 new-window

# leader-w-2 : split horizontally (top/bottom)
bind-key -T w_table 2 split-window -v

# leader-w-3 : split vertically (left/right)
bind-key -T w_table 3 split-window -h

# leader-w-w : move to next pane
bind-key -T w_table w select-pane -t :.+

# leader-w-q : move to previous pane
bind-key -T w_table q select-pane -t :.-

# leader-w-x : close current pane
bind-key -T w_table k kill-pane

# ─── Navigation (leader + arrow) ─────────────────────────────────────────────
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

# ─── Resize (leader-r + arrow) ───────────────────────────────────────────────
bind-key r switch-client -T resize_table
bind-key -T resize_table Up    resize-pane -U 5
bind-key -T resize_table Down  resize-pane -D 5
bind-key -T resize_table Left  resize-pane -L 5
bind-key -T resize_table Right resize-pane -R 5

# ─── General settings ─────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -s escape-time 0
set -g default-terminal "tmux-256color"
